<title>Tikrar Hifz Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column like a mushaf page, task rows on Today, bottom tab bar for the three pillars */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --sunk:#E8EEEA; --ink:#15211C; --muted:#5A6A62; --line:#D7E0DA;
  --green:#1D5A46; --green-ink:#FFFFFF; --green-soft:#E1EDE6; --gold:#A6761A; --gold-soft:#F5EBD3;
  --danger:#B0412D; --danger-soft:#F7E4DF; --ok:#2B7A54;
  --c-none:#DDE5E0; --c-rev:#8DB7A3; --c-conn:#1D5A46; --c-new:#C99A3A;
  --f-display:"Reem Kufi","Trebuchet MS",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"Amiri","Traditional Arabic","Geeza Pro",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#111915; --ink:#E4ECE7; --muted:#93A39A; --line:#25332C;
  --green:#5DB38D; --green-ink:#0B1511; --green-soft:#1A2D24; --gold:#D8AF5C; --gold-soft:#2C2616;
  --danger:#E27C64; --danger-soft:#33201B; --ok:#6CC797;
  --c-none:#223029; --c-rev:#3D6B57; --c-conn:#5DB38D; --c-new:#D8AF5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#111915; --ink:#E4ECE7; --muted:#93A39A; --line:#25332C;
  --green:#5DB38D; --green-ink:#0B1511; --green-soft:#1A2D24; --gold:#D8AF5C; --gold-soft:#2C2616;
  --danger:#E27C64; --danger-soft:#33201B; --ok:#6CC797;
  --c-none:#223029; --c-rev:#3D6B57; --c-conn:#5DB38D; --c-new:#D8AF5C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--green)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.mark{font-family:var(--f-ar);font-size:30px;line-height:1;color:var(--green)}
.top-txt{flex:1;min-width:0}
.top-txt h1{font-size:17px}
.top-txt .d{font-size:12.5px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--danger)} .sync.busy i{background:var(--gold)}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:18px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}

/* hero */
.hero{cursor:pointer;background:var(--green);color:var(--green-ink);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end}
.hero .label{color:inherit;opacity:.75}
.hero .pg{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.hero .sub{opacity:.85;font-size:14px}
.hero button{background:none;border:0;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}.hero .hero-main{display:block;min-width:0}.hero .day{text-align:right;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding-left:12px;font-family:var(--f-display);font-size:15px;opacity:.9}

/* task rows */
.tasks{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task:hover{background:var(--sunk)}
.task .t{font-weight:600}
.task .s{font-size:13px;color:var(--muted)}
.ql{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1.5px;text-underline-offset:4px}.ql:hover{text-decoration-color:var(--green)}

.note .ql{color:var(--green)}
.ql{color:inherit;font:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1.5px;text-underline-offset:4px}.ql:hover{text-decoration-color:var(--green)}
#mv{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
#mv[hidden]{display:none}
.mv-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.mv-top .tt{flex:1;min-width:0;text-align:center}.mv-top .tt b{display:block}.mv-top .tt span{font-size:12px;color:var(--muted)}
.mv-x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px}
.mv-body{flex:1;overflow:auto;padding:8px 4px 16px;touch-action:pan-x pan-y}
.mv-page{max-width:900px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.mv-z{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:600 13px/1 inherit;padding:0 6px}
.mv-ln{direction:rtl;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;color:inherit;position:relative;border-radius:6px;transition:opacity .15s}
.mv-page.pl{background:#FFFDF7;color:#1B1B17;border-color:#E6E0CF}.mv-page.pd{background:#121814;color:#E8EEEA;border-color:#26342D}
.mv-page.pl .mv-ln.hid::after{background:#F2EEE3;border-color:#D9D2BF}.mv-page.pd .mv-ln.hid::after{background:#19231E;border-color:#2E3D36}
.mv-page.pl .mv-ln.nxt::after,.mv-page.pd .mv-ln.nxt::after{border-color:var(--green)}
.mv-ln.c{justify-content:center;gap:.25em}
.mv-ln.dim{opacity:.28}
.mv-ln.hid>*{visibility:hidden}
.mv-ln.hid::after{content:"";position:absolute;inset:22% 2%;border-radius:6px;background:var(--sunk);border:1px dashed var(--line)}
.mv-ln.nxt::after{border-color:var(--green)}
.mv-sh{direction:rtl;justify-content:center;font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif}
.mv-sh .fr{border:1.5px solid var(--green);border-radius:999px;padding:0 1.2em;line-height:1.5;font-size:.62em;color:var(--green)}
.mv-bs{font-size:.62em}
.mv-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:var(--surface)}
.mv-bar .btn{min-width:0}
.mv-msg{text-align:center;color:var(--muted);padding:40px 10px}
.task .bar{display:block;height:4px;border-radius:2px;background:var(--sunk);margin-top:7px;overflow:hidden}
.task .bar b{display:block;height:100%;background:var(--green);border-radius:2px}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.tick.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tick.part{border-color:var(--gold);color:var(--gold)}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--green-soft);color:var(--ok)}
.chip.prog{background:var(--gold-soft);color:var(--gold)}
.chip.rest{background:var(--sunk);color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* steps */
.steps{display:flex;flex-direction:column;gap:0;counter-reset:st}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-block:14px;border-top:1px dashed var(--line)}
.step:first-child{border-top:0;padding-top:4px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--muted)}
.step.ok .n{background:var(--ok);color:var(--surface)}
.step.locked{opacity:.55}
.step.collapsed{padding-block:10px;cursor:pointer}
.step.collapsed .note,.step.collapsed .row,.step.collapsed .counter{display:none}
.step.collapsed .h::after{content:' ›';color:var(--muted)}
.step.collapsed:hover .h{color:var(--green)}
.step .h{font-weight:600}
.step .note{font-size:13px;color:var(--muted);margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.dots{display:flex;gap:8px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted)}
.dot.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:500;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.pri:hover{filter:brightness(1.08);background:var(--green)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.warn:hover{background:var(--danger-soft)}
.btn.gold{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--surface);font-weight:500}
.check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--surface);flex:none}
.check.on .box{background:var(--ok);border-color:var(--ok)}

/* counter */
.counter{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:10px}
.ring{width:112px;height:112px;position:relative;border:0;background:none;padding:0;border-radius:50%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--sunk)} .ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .25s}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;align-content:center;line-height:1.1}
.ring .c b{font-family:var(--f-display);font-size:30px;font-weight:700}
.ring .c span{font-size:12px;color:var(--muted)}
.ring:active{transform:scale(.97)}
.ctrls{display:flex;flex-direction:column;gap:8px;min-width:0}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .m{min-width:0}
.li .m b{font-weight:600}
.li .m div{font-size:12.5px;color:var(--muted)}
.cb{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--surface);font-weight:700;font-size:14px}
.cb.on{background:var(--ok);border-color:var(--ok)}
.flag{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted)}
.flag.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:600}
.grp+.grp{margin-top:14px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:13px}
.grp-h b{font-family:var(--f-display);font-size:15px;font-weight:600}
.grp-h span{color:var(--muted)}
.grp .li:first-child{border-top:0}
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow input{min-width:0;width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.srow .sbtns{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.srow.off input{opacity:.5}
.mini{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.mini:disabled{opacity:.35;cursor:not-allowed}
.sw{width:42px;height:24px;border-radius:12px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
.cnt{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}
.cnt input{width:58px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.amt{display:flex;flex-direction:column;gap:8px}
.amt .seg-wrap>span{min-width:40px}
.seg-wrap select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.seg-wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--line);background:none;padding:7px 0;font-weight:600;min-width:42px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--green);color:var(--green-ink)}
.wklist{display:flex;flex-direction:column;gap:10px}
.wkrow{grid-template-columns:1fr auto}
.wkb{display:flex;gap:6px}
.wkbar{display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--sunk);vertical-align:middle;margin:0 6px;overflow:hidden}.wkbar b{display:block;height:100%;background:var(--ok)}
.wkdots{margin-left:6px;vertical-align:middle}
.wk{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.wk.ready{border-color:var(--ok)}
.wk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wk-top .m{min-width:0}
.wk-streak{display:flex;align-items:center;gap:8px}
.wkdots{display:inline-flex;gap:4px}.wkdots i{width:9px;height:9px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}.wkdots i.on{background:var(--ok);border-color:var(--ok)}
.wk input{width:100%;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:inherit;font-size:13.5px}
.wk .row{margin-top:2px}
.sug{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sug .li{grid-template-columns:auto 1fr auto auto}
.rec{margin-top:14px}.rec summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
nav .ico{position:relative;display:inline-flex}
.nbadge{position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:var(--surface);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.rowend{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end}
details.setup{border-top:1px solid var(--line);padding-top:10px;margin-bottom:6px}
details.setup>summary{cursor:pointer;font-weight:500;color:var(--muted);font-size:14px}
.wtag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;vertical-align:1px}
.wtag.w1{background:var(--gold-soft);color:var(--gold)}.wtag.w2{background:#3a2716;color:#f0a35e}.wtag.w3{background:var(--danger-soft);color:var(--danger)}
:root[data-theme="light"] .wtag.w2{background:#fbe6d2;color:#a2531a}@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .wtag.w2{background:#fbe6d2;color:#a2531a}}
.wkmenu{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;justify-content:flex-end}
.wkrow{grid-template-columns:1fr auto!important}
.rplist{display:flex;flex-direction:column}
.rp{padding-block:12px;border-top:1px solid var(--line)}.rp:first-child{border-top:0;padding-top:4px}
.rp-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rp .row{margin-top:8px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;background:var(--sunk)}


/* mushaf grid */
.juz{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding-block:2px}
.juz .jl{font-size:11px;color:var(--muted);text-align:right}
.cells{display:flex;flex-wrap:nowrap;gap:2px}
.cell{flex:1 1 0;max-width:11px;min-width:5px;height:14px;border-radius:2px;background:var(--c-none)}
.cell.rev{background:var(--c-rev)} .cell.conn{background:var(--c-conn)} .cell.new{background:var(--c-new)}
.cell.weak{outline:2px solid var(--danger);outline-offset:-1px}.cell.weak.w1{outline-color:#d8af5c}.cell.weak.w2{outline-color:#e08a3c}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}

/* settings */
.field{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field .fl b{font-weight:500;display:block}
.field .fl span{font-size:12.5px;color:var(--muted)}
.field input[type=number],.field select{width:84px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:center}
.field select{width:auto;text-align:left;max-width:100%}
.field.full{grid-template-columns:1fr}
.field input[type=text]{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:40px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.days button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:600}
.confirm{background:var(--danger-soft);border:1px solid var(--danger);border-radius:11px;padding:12px;font-size:14px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button.on{color:var(--green);font-weight:600}
nav button .pip{width:5px;height:5px;border-radius:50%;background:transparent}
nav button .pip.todo{background:var(--gold)}

let docRef=null,saving=false,pending=false,timer=null;
function save(){
  S.updated=Date.now();
  // keep only ~70 days of detailed logs
  const cut=appNow();cut.setDate(cut.getDate()-70);const ck=dk(cut);
  Object.keys(S.logs).forEach(k=>{if(k<ck)delete S.logs[k]});Object.keys(S.revLog).forEach(k=>{if(k<ck)delete S.revLog[k]});Object.keys(S.revExtra).forEach(k=>{if(k<ck)delete S.revExtra[k]});if(S.revStack.length>40)S.revStack=S.revStack.slice(-40);
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!docRef)return;

}
async function flush(){
  timer=null;if(!docRef)return;
  if(saving){pending=true;return}
  saving=true;setSync('busy');
  try{await docRef.set({json:JSON.stringify(S),updated:S.updated,client:CLIENT});setSync('account')}
  catch(e){setSync('error')}

async function initStore(){
  if(!window.claude||!window.claude.use)return;

  try{
    const res=await Promise.race([(async()=>{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user)return null;
      const id=await user.id();if(!id)return null;
      const ref=db.collection('data/users/'+id).doc('tikrar');
      const snap=await ref.get();return{ref,snap};
    })(),to]);
    if(!res||res==='timeout'){ui.sync='device';render();return}
    docRef=res.ref;
    if(res.snap.exists){const d=res.snap.data()||{};try{const remote=normalize(JSON.parse(d.json));if((remote.updated||0)>=(S.updated||0))S=remote}catch(e){}}
    else if(S.updated){flush()}
    ui.sync='account';render();
    docRef.onSnapshot(snap=>{if(!snap.exists)return;const d=snap.data()||{};if(d.client===CLIENT||saving||timer)return;
      if((d.updated||0)>(S.updated||0)){try{S=normalize(JSON.parse(d.json));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}catch(e){}}},()=>{});
  }catch(e){ui.sync='device';render()}
}
